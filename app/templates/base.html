<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}music-manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('library.index') }}" class="nav-brand">music-manager</a>
    <div class="nav-links">
      <a href="{{ url_for('library.index') }}">Library</a>
      <a href="{{ url_for('failed.index') }}">Failed</a>
      <a href="{{ url_for('queue.index') }}">Queue</a>
      <a href="{{ url_for('browse.index') }}">Browse</a>
    </div>
  </nav>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
